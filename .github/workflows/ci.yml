name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Python tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -v

      - name: Run full demo
        run: python -m agi_symposium.demo --reset --nickname ciagent --ai-system local
